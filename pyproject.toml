[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-torrent"
version = "0.10.0"
authors = [
  { name="Piratebird" },
]
description = "The Helm torrent automation CLI (unrelated to Kubernetes Helm)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0"
]

[project.optional-dependencies]
download = ["libtorrent>=2.0.0,<2.1.0"]
dev = [
    "pytest",
    "pytest-cov",
    "responses",
    "types-requests"
]

[project.urls]
"Homepage" = "https://github.com/Piratebird/helm"

[project.scripts]
helm-torrent = "helm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
