services:
  jackett:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-jackett"
    image: lscr.io/linuxserver/jackett:latest
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=jackett"
      - "com.docker.compose.oneoff=False"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    security_opt:
      - label=disable
    volumes:
      - /home/piratebird/.local/state/helm/jackett:/config
      - /home/piratebird/Downloads/helm:/downloads
    ports:
      - 19117:9117
    restart: unless-stopped

  flaresolverr:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-flaresolverr"
    image: ghcr.io/flaresolverr/flaresolverr:latest
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=flaresolverr"
      - "com.docker.compose.oneoff=False"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    security_opt:
      - label=disable
    ports:
      - 18191:8191
    restart: unless-stopped

  mini-helm:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-mini-helm"
    image: ghcr.io/piratebird/helm:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    stdin_open: true
    tty: true
    env_file:
      - /home/piratebird/.local/state/helm/.env.docker
    security_opt:
      - label=disable
    volumes:
      - /home/piratebird/.config/helm/config.json:/app/config.json
      - ${HOST_PWD:-.}/src:/app/src
      - ${HOST_PWD:-.}/docker-compose.yml:/app/docker-compose.yml
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - cli

  qbittorrent:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-qbittorrent"
    image: lscr.io/linuxserver/qbittorrent:latest
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=qbittorrent"
      - "com.docker.compose.oneoff=False"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=18080
    security_opt:
      - label=disable
    volumes:
      - /home/piratebird/.local/state/helm/qbittorrent:/config
      - /home/piratebird/Downloads/helm:/downloads
    ports:
      - 18080:18080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped
