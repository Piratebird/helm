name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-scripts:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './'

  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    strategy:
      # Report every Python version instead of cancelling the rest on the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] ruff mypy
          # libtorrent ships wheels for most, not all, of these Pythons; its tests skip without it.
          pip install "libtorrent>=2.0.0,<2.1.0" || echo "::notice::No libtorrent wheel for Python ${{ matrix.python-version }}"

      - name: Lint and Format with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy src/

      - name: Run Pytest
        run: |
          if [ -d "tests" ]; then pytest tests/ -rs --cov=src/helm --cov-report=xml; fi

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: helm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Image
        run: docker run --rm helm:latest --help
