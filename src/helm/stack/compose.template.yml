#@ Template rules, shared by setup.sh (render_compose) and helm.stack.compose:
#@   "if NAME" ... "end" marker lines keep what is between them only when
#@   block NAME is on. Blocks nest. Lines starting with these markers never
#@   reach the output. The four placeholders (state, downloads, config and
#@   engine socket, each written between at-signs) become real paths, and
#@   ${...} values are left for compose to fill in.
# Generated by Helm from src/helm/stack/compose.template.yml.
# Re-run ./setup.sh (or helm-torrent init) to change it instead of editing it.

services:
#@ if jackett
  jackett:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-jackett"
    image: lscr.io/linuxserver/jackett:latest
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=jackett"
      - "com.docker.compose.oneoff=False"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    security_opt:
      - label=disable
    volumes:
      - "@HELM_STATE@/jackett:/config"
      - "@HELM_DL@:/downloads"
    ports:
      - 19117:9117
    restart: unless-stopped

#@ end
#@ if prowlarr
  prowlarr:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-prowlarr"
    image: lscr.io/linuxserver/prowlarr:latest
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=prowlarr"
      - "com.docker.compose.oneoff=False"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    security_opt:
      - label=disable
    volumes:
      - "@HELM_STATE@/prowlarr:/config"
    ports:
      - 19696:9696
    restart: unless-stopped

#@ end
  flaresolverr:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-flaresolverr"
    image: ghcr.io/flaresolverr/flaresolverr:latest
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=flaresolverr"
      - "com.docker.compose.oneoff=False"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=info
      - TZ=Etc/UTC
    security_opt:
      - label=disable
    ports:
      - 18191:8191
    restart: unless-stopped

#@ if cli
  cli:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-cli"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ghcr.io/piratebird/helm:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    stdin_open: true
    tty: true
    env_file:
      - "@HELM_STATE@/.env.docker"
    environment:
      - HELM_CONFIG_DIR=/config/helm
    security_opt:
      - label=disable
    volumes:
      - "@HELM_CONFIG@:/config/helm"
#@ if source
      - "${HOST_PWD:-.}/src:/app/src"
#@ end
      - "${HOST_PWD:-.}/docker-compose.yml:/app/docker-compose.yml"
      - "@ENGINE_SOCKET@:/var/run/docker.sock"
    profiles:
      - cli

#@ end
#@ if vpn
  gluetun:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-gluetun"
    image: qmcgaw/gluetun:latest
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=gluetun"
      - "com.docker.compose.oneoff=False"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - "@HELM_STATE@/.env.docker"
    volumes:
      - "@HELM_STATE@/gluetun:/gluetun"
    ports:
      - 18080:18080
      - 6881:6881
      - 6881:6881/udp
    restart: unless-stopped

#@ end
  qbittorrent:
    container_name: "${COMPOSE_PROJECT_NAME:-helm}-qbittorrent"
    image: lscr.io/linuxserver/qbittorrent:latest
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    labels:
      - "com.docker.compose.project=${COMPOSE_PROJECT_NAME:-helm}"
      - "com.docker.compose.service=qbittorrent"
      - "com.docker.compose.oneoff=False"
#@ if vpn
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
#@ end
#@ if novpn
    dns:
      - 8.8.8.8
      - 1.1.1.1
#@ end
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - WEBUI_PORT=18080
    security_opt:
      - label=disable
    volumes:
      - "@HELM_STATE@/qbittorrent:/config"
      - "@HELM_DL@:/downloads"
#@ if novpn
    ports:
      - 18080:18080
      - 6881:6881
      - 6881:6881/udp
#@ end
    restart: unless-stopped
